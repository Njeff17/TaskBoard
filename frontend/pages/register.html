<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — TaskBoard</title>
  <meta name="description" content="Create a free TaskBoard account to start managing your projects." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/auth.css" />
</head>
<body class="auth-wrapper">

  <div class="auth-card card border">
    <div class="card-body p-4 p-sm-5">

      <!-- Brand -->
      <div class="text-center mb-4">
        <div class="auth-icon">📋</div>
        <h1 class="h4 fw-bold brand-text">TaskBoard</h1>
        <p class="text-muted small mt-1">Create your free account</p>
      </div>

      <!-- Error alert -->
      <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>

      <!-- Form -->
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="name">Full name</label>
          <input id="name" name="name" type="text" class="form-control"
                 placeholder="Jane Smith" autocomplete="name" required />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email address</label>
          <input id="email" name="email" type="email" class="form-control"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control"
                 placeholder="At least 6 characters" autocomplete="new-password" required />
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold" for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" class="form-control"
                 placeholder="Repeat your password" autocomplete="new-password" required />
        </div>

        <button id="submit-btn" type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          Create Account
        </button>
      </form>

      <hr class="my-4" />
      <p class="text-center text-muted small mb-0">
        Already have an account? <a href="/pages/login.html" class="fw-semibold">Log in</a>
      </p>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
