<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — TaskBoard</title>
  <meta name="description" content="View and update your TaskBoard profile." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/dashboard.css" />
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
  <nav class="navbar sticky-top app-navbar px-3">
    <a class="brand-text" href="/pages/projects.html">📋 TaskBoard</a>
    <div class="d-flex align-items-center gap-2">
      <a href="/pages/profile.html" class="text-decoration-none d-flex align-items-center gap-2">
        <div class="navbar-avatar" id="navbar-avatar"></div>
        <span id="navbar-user-name" class="text-light small d-none d-sm-inline"></span>
      </a>
      <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Log out</button>
    </div>
  </nav>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main class="container py-4">

    <div class="mb-4 pb-3 border-bottom">
      <h1 class="h3 fw-bold mb-1">My Profile</h1>
      <p class="text-muted small mb-0">View and update your account details.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card border">
          <div class="card-body p-4">

            <!-- Avatar & info -->
            <div class="text-center mb-4">
              <div class="profile-avatar-lg" id="profile-avatar">?</div>
              <p class="text-secondary mb-0" id="profile-email"></p>
              <small class="text-muted" id="profile-member"></small>
            </div>

            <!-- Stats row -->
            <div class="row g-3 mb-4">
              <div class="col-6">
                <div class="card border text-center py-3">
                  <div class="h2 fw-bold brand-text mb-0" id="stat-projects">—</div>
                  <small class="text-muted text-uppercase" style="letter-spacing:.06em">Projects</small>
                </div>
              </div>
              <div class="col-6">
                <div class="card border text-center py-3">
                  <div class="h2 fw-bold text-success mb-0">✓</div>
                  <small class="text-muted text-uppercase" style="letter-spacing:.06em">Active</small>
                </div>
              </div>
            </div>

            <hr class="my-3" />

            <!-- Feedback alerts -->
            <div id="profile-success" class="alert alert-success d-none" role="status"></div>
            <div id="profile-error"   class="alert alert-danger  d-none" role="alert"></div>

            <!-- Edit form -->
            <form id="profile-form" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="profile-name">Display name</label>
                <input id="profile-name" name="name" type="text" class="form-control"
                       placeholder="Your name" autocomplete="name" required />
              </div>
              <button id="profile-submit" type="submit" class="btn btn-primary fw-semibold px-4">
                Save Changes
              </button>
            </form>

            <hr class="my-4" />

            <div class="text-center">
              <button class="btn btn-outline-secondary btn-sm"
                      onclick="document.getElementById('logout-btn').click()">
                🔓 Log out of TaskBoard
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
