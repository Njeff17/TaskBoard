<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects — TaskBoard</title>
  <meta name="description" content="View and manage all your TaskBoard projects." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/dashboard.css" />
</head>

<body>

  <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
  <nav class="navbar sticky-top app-navbar px-3">
    <a class="brand-text" href="/pages/projects.html">📋 TaskBoard</a>
    <div class="d-flex align-items-center gap-2">
      <a href="/pages/profile.html" class="text-decoration-none d-flex align-items-center gap-2">
        <div class="navbar-avatar" id="navbar-avatar"></div>
        <span id="navbar-user-name" class="text-muted small d-none d-sm-inline"></span>
      </a>
      <button id="logout-btn" class="btn btn-outline-secondary btn-sm">Log out</button>
    </div>
  </nav>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main class="container py-4">

    <!-- Page header -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4 pb-3 border-bottom">
      <div>
        <h1 class="h3 fw-bold mb-1">My Projects</h1>
        <p class="text-muted small mb-0">Manage all your team projects in one place.</p>
      </div>
      <div class="d-flex gap-2">
        <input id="search-input" type="search" class="form-control form-control-sm" placeholder="🔍 Search projects…"
          style="width:200px" />
        <button id="new-project-btn" class="btn btn-primary btn-sm fw-semibold"><i class="bi bi-plus-lg me-1"></i>New Project</button>
      </div>
    </div>

    <!-- Projects grid (Bootstrap row, filled by JS) -->
    <div id="projects-grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>

  </main>

  <!-- ── Bootstrap Modal (shared) ───────────────────────────────────────── -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border">
        <div class="modal-header border-bottom">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer border-top">
          <button id="modal-cancel" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="modal-confirm" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/projects.js"></script>
</body>

</html>
