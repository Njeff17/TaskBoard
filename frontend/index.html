<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskBoard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/styles/main.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div class="text-center">
        <div style="font-size:3rem" class="mb-2"><i class="bi bi-check-square-fill brand-text"></i></div>
        <h1 class="brand-text mb-1">TaskBoard</h1>
        <p class="text-muted small">Redirecting…</p>
        <div class="spinner-border text-primary mt-3" role="status">
            <span class="visually-hidden">Loading</span>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('taskboard_token');
        window.location.href = token ? '/pages/projects.html' : '/pages/login.html';
    </script>
</body>

</html>
